name: CareerPilot Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'careerpilot-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'careerpilot-backend/**'

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careerpilot_test
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: careerpilot-backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/careerpilot_test
          DB_USERNAME: careerpilot
          DB_PASSWORD: careerpilot
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-production
          GEMINI_API_KEY: test-key
        run: mvn test -q

  # ── Build & Push Docker Image ────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: careerpilot-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/careerpilot-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/careerpilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
