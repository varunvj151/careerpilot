spring:
  application:
    name: careerpilot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/careerpilot}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never

security:
  jwt:
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key}
    model: gemini-1.5-flash
    temperature: 0.3
    top-p: 0.95
    max-output-tokens: 8192
    timeout-seconds: 30
    max-retries: 3

score:
  weights:
    required-skills: 0.35
    experience: 0.20
    projects: 0.15
    education: 0.10
    keyword-coverage: 0.10
    ai-quality: 0.10

logging:
  level:
    com.careerpilot: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

spring.cache:
  type: redis
  redis:
    time-to-live: 1h

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      geminiApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
  retry:
    instances:
      geminiApi:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - java.net.SocketTimeoutException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - java.lang.RuntimeException
